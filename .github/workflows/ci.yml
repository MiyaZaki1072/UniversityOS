name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uos
          POSTGRES_PASSWORD: uos
          POSTGRES_DB: uos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U uos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://uos:uos@localhost:5432/uos_test
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_SETTINGS_MODULE: config.settings.development
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # The backend is created in ticket T-01; until then this job passes without running anything.
      - name: Detect backend
        id: detect
        run: |
          if [ -f manage.py ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: pip install -r requirements-dev.txt

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: |
          ruff check .
          ruff format --check .

      - name: Migrations are up to date
        if: steps.detect.outputs.present == 'true'
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        if: steps.detect.outputs.present == 'true'
        run: pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc -b

      - name: Build
        run: npm run build
