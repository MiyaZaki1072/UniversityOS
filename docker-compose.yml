# University OS — production stack (db + backend + web + nightly backup).
# Copy .env.example to .env, fill in the secrets, then: docker compose up -d --build
# For local development use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:-uos}
  POSTGRES_USER: ${POSTGRES_USER:-uos}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment: *db-env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.production}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-uos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-uos}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      ADMIN_URL: ${ADMIN_URL:-manage/}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-0}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}
      SECURE_HSTS_PRELOAD: ${SECURE_HSTS_PRELOAD:-false}

  web:
    build:
      context: ./frontend
      args:
        VITE_DATA_MODE: server
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      ADMIN_URL: ${ADMIN_URL:-manage/}
    ports:
      - "${WEB_PORT:-8080}:80"

  # Dumps the database once a day into ./backups (kept BACKUP_KEEP_DAYS days).
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-uos}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-uos}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/uos-$$(date +%Y%m%d-%H%M).sql.gz
          if pg_dump --clean --if-exists | gzip > "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup ok: $$f"; else rm -f "$$f.tmp"; echo "backup FAILED"; fi
          find /backups -name 'uos-*.sql.gz' -mtime +"$$BACKUP_KEEP_DAYS" -delete
          sleep 86400
        done

volumes:
  postgres_data:
