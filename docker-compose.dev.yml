services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    command:
      - sh
      - -c
      - "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
